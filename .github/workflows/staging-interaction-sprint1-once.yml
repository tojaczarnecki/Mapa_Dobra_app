name: One-time Sprint 1 staging interaction smoke

on:
  push:
    branches:
      - audit-fixes/sprint-1-correctness

permissions:
  contents: read

jobs:
  interaction-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      BASE_URL: https://staging.host11515.iqhs.pl
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - name: Install Playwright
        run: |
          npm install --no-save --ignore-scripts playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run interaction smoke
        shell: bash
        run: |
          cat > .staging-smoke.mjs <<'NODE'
          import { chromium } from 'playwright';
          import assert from 'node:assert/strict';

          const base = process.env.BASE_URL;
          const browser = await chromium.launch({ headless: true });
          const context = await browser.newContext({ viewport: { width: 390, height: 844 } });
          await context.addInitScript(() => localStorage.setItem('mapa-dobra:privacy-consent', 'necessary'));
          const page = await context.newPage();

          async function placeLinks(url) {
            await page.goto(base + url, { waitUntil: 'networkidle' });
            return [...new Set(await page.locator('a[href*="/lodz/"]').evaluateAll(els => els.map(a => a.getAttribute('href')).filter(Boolean)))];
          }

          // Canonical map -> Leaflet marker -> detail -> return with preserved filters.
          const mapUrl = '/szukaj?view=map&kategoria=jedzenie&otwarte=1';
          await page.goto(base + mapUrl, { waitUntil: 'networkidle' });
          await page.waitForTimeout(5000);
          const individualMarker = page.locator('.leaflet-marker-icon[title]').first();
          if (!(await individualMarker.count())) {
            const cluster = page.locator('.leaflet-marker-icon:not([title])').first();
            assert.ok(await cluster.count(), 'map should expose an individual marker or a marker cluster after Leaflet settles');
            await cluster.click();
            await page.waitForTimeout(1500);
          }
          const marker = page.locator('.leaflet-marker-icon[title]').first();
          await marker.waitFor({ state: 'visible', timeout: 10000 });
          await marker.click();
          const detailLink = page.locator('.leaflet-popup a[href*="/lodz/"]').last();
          await detailLink.waitFor({ state: 'visible', timeout: 10000 });
          await detailLink.click();
          await page.waitForLoadState('networkidle');
          const back = page.getByRole('link', { name: /Wróć do mapy/i }).first();
          assert.ok(await back.count(), 'detail should expose Wróć do mapy');
          await back.click();
          await page.waitForLoadState('networkidle');
          const returned = new URL(page.url());
          assert.equal(returned.pathname, '/szukaj');
          assert.equal(returned.searchParams.get('view'), 'map');
          assert.equal(returned.searchParams.get('kategoria'), 'jedzenie');
          assert.equal(returned.searchParams.get('otwarte'), '1');
          console.log('MAP_RETURN_OK', returned.pathname + returned.search);

          const fridgeLinks = await placeLinks('/lodowki-spoleczne');
          console.log('FOOD_SHARING_LINKS', JSON.stringify(fridgeLinks));
          for (const href of fridgeLinks.slice(0, 8)) {
            await page.goto(new URL(href, base).href, { waitUntil: 'networkidle' });
            const text = (await page.locator('body').innerText()).replace(/\s+/g, ' ').trim();
            const routeCount = await page.getByRole('link', { name: /^Trasa$/i }).count();
            const contradictory = /ZAMKNIĘTE TERAZ/i.test(text) && /DOSTĘP 24\/7/i.test(text);
            assert.equal(contradictory, false, `closed food-sharing record must not claim 24/7: ${href}`);
            console.log('FOOD_SHARING_DETAIL', JSON.stringify({ href, routeCount, text: text.slice(0, 900) }));
          }

          const mobileLinks = await placeLinks('/szukaj?zapytanie=mobilna');
          console.log('MOBILE_SEARCH_LINKS', JSON.stringify(mobileLinks));
          let mobileFound = 0;
          for (const href of mobileLinks.slice(0, 20)) {
            await page.goto(new URL(href, base).href, { waitUntil: 'networkidle' });
            const text = (await page.locator('body').innerText()).replace(/\s+/g, ' ').trim();
            if (/Mobilna usługa|Sezonowo|postoj|Baza \/ organizator/i.test(text)) {
              mobileFound++;
              const routeCount = await page.getByRole('link', { name: /^Trasa$/i }).count();
              assert.equal(routeCount, 0, `mobile service must not route to its base address: ${href}`);
              console.log('MOBILE_DETAIL', JSON.stringify({ href, routeCount, text: text.slice(0, 1200) }));
            }
          }
          console.log('MOBILE_FOUND', mobileFound);

          await browser.close();
          NODE
          node .staging-smoke.mjs
