name: One-time final Sprint 1 staging deploy

on:
  push:
    branches:
      - audit-fixes/sprint-1-correctness

permissions:
  contents: read

concurrency:
  group: iqhost-sprint1-final-staging
  cancel-in-progress: false

jobs:
  build-deploy-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CI: true
      DATABASE_URL: postgresql://ci-placeholder.invalid/ci
      STAGING_SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
      STAGING_SSH_USER: ${{ secrets.STAGING_SSH_USER }}
      STAGING_SSH_PORT: ${{ secrets.STAGING_SSH_PORT }}
      STAGING_SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
      STAGING_SSH_KNOWN_HOSTS: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}
      STAGING_APP_ROOT: /home/host11515/apps/mapa-dobra-git-staging
      STAGING_BASE_URL: ${{ secrets.STAGING_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - name: Install, generate, test and lint
        run: |
          set -euo pipefail
          npm ci
          npm run prisma:generate
          npm test
          npm run lint
      - name: Build staging production application
        env:
          NODE_ENV: production
          DEPLOYMENT_ENV: staging
          PUBLIC_DATA_MODE: production
          RATE_LIMIT_MODE: memory
          APP_BASE_URL: https://staging.host11515.iqhs.pl
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
          GEOCODER_USER_AGENT: MapaDobraCI/1.0
          GEOCODER_CONTACT_EMAIL: ci@example.invalid
        run: |
          set -euo pipefail
          npm run build
          npm prune --omit=dev
          test -s .next/BUILD_ID
      - name: Package release
        id: release
        shell: bash
        run: |
          set -euo pipefail
          BUILD_ID="$(tr -d '\n\r' < .next/BUILD_ID)"
          ARCHIVE="release-${BUILD_ID}.tar.gz"
          tar --create --gzip --file "$ARCHIVE" --exclude='.next/cache' --exclude='.next/dev' --exclude='.git' --exclude='.env' --exclude='.env.*' .next node_modules public package.json package-lock.json next.config.ts src/generated/prisma
          test -s "$ARCHIVE"
          echo "build_id=$BUILD_ID" >> "$GITHUB_OUTPUT"
          echo "archive=$ARCHIVE" >> "$GITHUB_OUTPUT"
      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          for name in STAGING_SSH_HOST STAGING_SSH_USER STAGING_SSH_PORT STAGING_SSH_PRIVATE_KEY STAGING_SSH_KNOWN_HOSTS STAGING_BASE_URL; do
            test -n "${!name:-}" || { echo "Missing staging secret: $name" >&2; exit 1; }
          done
          test "$STAGING_APP_ROOT" = "/home/host11515/apps/mapa-dobra-git-staging"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$STAGING_SSH_PRIVATE_KEY" > "$HOME/.ssh/mapa_dobra_staging"
          chmod 600 "$HOME/.ssh/mapa_dobra_staging"
          printf '%s\n' "$STAGING_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
      - name: Verify staging target
        shell: bash
        run: |
          set -euo pipefail
          TARGET="$STAGING_SSH_USER@$STAGING_SSH_HOST"
          SSH=(ssh -p "$STAGING_SSH_PORT" -i "$HOME/.ssh/mapa_dobra_staging" -o BatchMode=yes -o StrictHostKeyChecking=yes)
          "${SSH[@]}" "$TARGET" "set -eu; test \"\$(hostname -f)\" = 'h1.iqhs.eu'; test -d '$STAGING_APP_ROOT'; test -f '$STAGING_APP_ROOT/server.cjs'; test \"\$(tr -d '\\r\\n' < '$STAGING_APP_ROOT/.deployment-env')\" = 'staging'; echo VERIFIED_STAGING_ROOT='$STAGING_APP_ROOT'"
      - name: Activate staging atomically
        id: activate
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="${{ steps.release.outputs.archive }}"
          BUILD_ID="${{ steps.release.outputs.build_id }}"
          TARGET="$STAGING_SSH_USER@$STAGING_SSH_HOST"
          SSH=(ssh -p "$STAGING_SSH_PORT" -i "$HOME/.ssh/mapa_dobra_staging" -o BatchMode=yes -o StrictHostKeyChecking=yes)
          SCP=(scp -P "$STAGING_SSH_PORT" -i "$HOME/.ssh/mapa_dobra_staging" -o BatchMode=yes -o StrictHostKeyChecking=yes)
          "${SSH[@]}" "$TARGET" "mkdir -p '$STAGING_APP_ROOT/incoming'"
          "${SCP[@]}" scripts/iqhost-release.sh "$TARGET:$STAGING_APP_ROOT/deploy-release.sh"
          "${SCP[@]}" "$ARCHIVE" "$TARGET:$STAGING_APP_ROOT/incoming/$ARCHIVE"
          "${SSH[@]}" "$TARGET" "chmod 700 '$STAGING_APP_ROOT/deploy-release.sh' && bash '$STAGING_APP_ROOT/deploy-release.sh' activate '$STAGING_APP_ROOT' '$STAGING_APP_ROOT/incoming/$ARCHIVE' staging && test \"\$(cat '$STAGING_APP_ROOT/current/.next/BUILD_ID')\" = '$BUILD_ID'"
      - name: Health and public correctness smoke
        shell: bash
        run: |
          set -euo pipefail
          BASE_URL="${STAGING_BASE_URL%/}"
          TARGET="$STAGING_SSH_USER@$STAGING_SSH_HOST"
          SSH=(ssh -p "$STAGING_SSH_PORT" -i "$HOME/.ssh/mapa_dobra_staging" -o BatchMode=yes -o StrictHostKeyChecking=yes)
          healthy=0
          for attempt in $(seq 1 12); do
            if curl --fail --silent --show-error --max-time 12 "$BASE_URL/api/health" >/tmp/health.json && jq -e '.status == "ok" and .checks.application == "ok" and .checks.configuration == "ok" and .checks.database == "ok"' /tmp/health.json >/dev/null; then
              healthy=1; break
            fi
            sleep 5
          done
          if [[ "$healthy" -ne 1 ]]; then
            "${SSH[@]}" "$TARGET" "bash '$STAGING_APP_ROOT/deploy-release.sh' rollback '$STAGING_APP_ROOT' staging" || true
            exit 1
          fi
          routes=("/" "/szukaj?kategoria=jedzenie" "/szukaj?view=map&kategoria=jedzenie" "/uruchom-pomoc" "/potrzeby" "/ulubione" "/lodowki-spoleczne")
          for route in "${routes[@]}"; do curl --fail --silent --show-error --max-time 20 "$BASE_URL$route" >/dev/null; done
          curl --fail --silent --show-error "$BASE_URL/szukaj?kategoria=jedzenie" >/tmp/search.html
          ! grep -Fq " km od Ciebie" /tmp/search.html
          ! grep -Fq ">Najbliżej<" /tmp/search.html
          "${SSH[@]}" "$TARGET" "test \"\$(cat '$STAGING_APP_ROOT/current/.next/BUILD_ID')\" = '${{ steps.release.outputs.build_id }}'"
          cat /tmp/health.json
          "${SSH[@]}" "$TARGET" "rm -f '$STAGING_APP_ROOT/incoming/${{ steps.release.outputs.archive }}'"
      - name: Report release
        run: echo "STAGING_BUILD_ID=${{ steps.release.outputs.build_id }}"
