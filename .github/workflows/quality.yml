name: Quality gates

on:
  pull_request:
  push:
    branches:
      - main
      - staging-uruchom-pomoc
  workflow_dispatch:

permissions:
  contents: read

env:
  CI: true
  NODE_VERSION: 22.x

jobs:
  static-unit:
    name: Unit & Static
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://ci-placeholder.invalid/ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate
      - run: npm run prisma:validate
      - run: npm test
      - run: npm run lint

  database-integration:
    name: Database Integration
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: mapa_dobra_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d mapa_dobra_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://ci:ci-only-password@localhost:5432/mapa_dobra_ci
      TEST_DATABASE_URL: postgresql://ci:ci-only-password@localhost:5432/mapa_dobra_ci
      TEST_BASE_DATABASE_URL: postgresql://ci-placeholder.invalid/base
      ADMIN_SEED_EMAIL: e2e-admin@example.test
      ADMIN_SEED_PASSWORD: E2E-only-password-123!
      ADMIN_SEED_DISPLAY_NAME: E2E Administrator
      TEST_BASE_URL: http://127.0.0.1:3000
      NODE_ENV: production
      DEPLOYMENT_ENV: staging
      APP_BASE_URL: https://127.0.0.1:3000
      TURNSTILE_MODE: disabled
      NEXT_PUBLIC_TURNSTILE_MODE: disabled
      RATE_LIMIT_MODE: memory
      PUBLIC_DATA_MODE: production
      GEOCODER_USER_AGENT: MapaDobraCI/1.0
      GEOCODER_CONTACT_EMAIL: ci@example.test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --include=dev
      - run: npm run prisma:generate
      - run: npm run prisma:validate
      - run: npx prisma migrate deploy
      - run: npm run seed:e2e
      - name: Start application for integration scripts
        shell: bash
        run: |
          set -euo pipefail
          npm run build > /tmp/mapa-dobra-ci-build.log
          npm run start -- --hostname 127.0.0.1 --port 3000 > /tmp/mapa-dobra-ci-server.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3000/api/health >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              cat /tmp/mapa-dobra-ci-server.log
              exit 1
            fi
            sleep 1
          done
      - run: npm run test:integration
      - run: npm run test:cms
      - run: npm run test:rbac
      - run: npm run test:rbac -- verify

  browser-e2e:
    name: Browser E2E
    needs: database-integration
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: mapa_dobra_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d mapa_dobra_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://ci:ci-only-password@localhost:5432/mapa_dobra_ci
      TEST_BASE_DATABASE_URL: postgresql://ci-placeholder.invalid/base
      ADMIN_SEED_EMAIL: e2e-admin@example.test
      ADMIN_SEED_PASSWORD: E2E-only-password-123!
      TEST_BASE_URL: http://127.0.0.1:3100
      NODE_ENV: production
      DEPLOYMENT_ENV: staging
      PUBLIC_DATA_MODE: production
      RATE_LIMIT_MODE: memory
      TURNSTILE_MODE: disabled
      NEXT_PUBLIC_TURNSTILE_MODE: disabled
      APP_BASE_URL: https://127.0.0.1:3100
      GEOCODER_USER_AGENT: MapaDobraE2E/1.0
      GEOCODER_CONTACT_EMAIL: e2e@example.test
      E2E_PUBLIC_RECORDS: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --include=dev
      - run: npm run prisma:generate
      - run: npx prisma migrate deploy
      - run: npm run seed:e2e
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
        env:
          CI: true
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore

  build-release:
    name: Build Artifact
    needs: [static-unit, database-integration, browser-e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging-uruchom-pomoc'
    uses: ./.github/workflows/build-staging-artifact.yml
